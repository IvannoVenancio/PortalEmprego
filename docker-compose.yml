services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: node-app
    ports:
      - 3000:3000
    volumes:
      - ./:/home/app/
    networks:
      - app-network
  db:
    image: mysql:8.0.30
    environment:
      MYSQL_DATABASE: 'portal_emprego'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'root'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'Dol-guldor299792458mysql'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'Dol-guldor299792458mysql'
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - my-db:/var/lib/mysql

    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55
# Names our volume
volumes:
  my-db:
networks:
  app-network:
    driver: bridge